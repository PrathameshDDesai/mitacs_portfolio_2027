services:
  # Project 1: Hospital Length of Stay (LOS) Predictor
  - type: web
    name: hospital-los-predictor
    env: python
    region: oregon
    plan: free
    rootDir: 01_hospital_los_prediction
    buildCommand: pip install -r requirements.txt && python train_and_export.py
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.10.13

  # Project 2: AgentGuard Network Anomaly Threat Detector
  - type: web
    name: agentguard-anomaly-detector
    env: python
    region: oregon
    plan: free
    rootDir: 02_network_anomaly_detection
    buildCommand: pip install -r requirements.txt && python train_and_export.py
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.10.13
